# dsh-save-money 快速试用 overlay（官方 --patch 方式，见 README「安装-方式一」）
# 用法：把下方 <REPO_ROOT> 替换成你本机仓库的绝对路径（整个文件只有这一处，
#       用编辑器的“全部替换”最快），然后：
#   dsh web --patch ./cordis.patch.yml
# 或（从仓库根，源码运行）：
#   pnpm dsh web --patch ./cordis.patch.yml
- insert:
    - id: save-money
      name: '<REPO_ROOT>/plugin/index.js'
